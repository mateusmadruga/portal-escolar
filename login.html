<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Portal Acadêmico Colégio Horizonte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

  <div class="a11y-bar" role="region" aria-label="Ferramentas de acessibilidade">
    <div class="container a11y-controls">
      <a href="index.html" class="back-link">&larr; Voltar ao site institucional</a>
      <div class="a11y-buttons">
        <button type="button" id="btn-font-dec" aria-label="Diminuir fonte">A-</button>
        <button type="button" id="btn-font-reset" aria-label="Fonte padrão">A</button>
        <button type="button" id="btn-font-inc" aria-label="Aumentar fonte">A+</button>
        <button type="button" id="btn-theme-toggle" aria-label="Alternar tema">🌓 Modo Escuro</button>
        <button type="button" id="btn-contrast-toggle" aria-label="Alternar alto contraste">👁️ Alto Contraste</button>
      </div>
    </div>
  </div>

  <main class="login-wrapper">
    <section class="login-card" aria-labelledby="login-heading">
      <div class="login-header">
        <span class="badge">Ambiente Seguro</span>
        <h1 id="login-heading">Portal Acadêmico</h1>
        <p>Gerenciamento de notas, frequência e turmas.</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="perfil">Perfil de Acesso</label>
          <select id="perfil" name="perfil">
            <option value="aluno">Aluno(a)</option>
            <option value="professor">Professor(a)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="matricula">Matrícula ou E-mail Institucional *</label>
          <input type="text" id="matricula" required placeholder="Ex: 20260145 ou docente@horizonte.edu.br">
        </div>

        <div class="form-group">
          <label for="senha">Senha *</label>
          <div class="password-wrapper">
            <input type="password" id="senha" required placeholder="Digite sua senha">
            <button type="button" id="toggle-password" class="btn-eye" aria-label="Mostrar ou ocultar senha">
              Mostrar
            </button>
          </div>
        </div>

        <div class="demo-credentials">
          <p><strong>Acesso rápido para demonstração:</strong></p>
          <div class="demo-btns">
            <button type="button" id="fill-aluno" class="btn-outline-sm">Preencher Aluno</button>
            <button type="button" id="fill-prof" class="btn-outline-sm">Preencher Professor</button>
          </div>
        </div>

        <button type="submit" class="btn-primary full-width">Entrar no Sistema</button>
        <div id="login-feedback" class="feedback-banner hidden" role="alert"></div>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
